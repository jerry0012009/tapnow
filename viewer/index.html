<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TapNow 备份查看器</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">LOCAL BACKUP REVIEW</p>
      <h1>TapNow 资产备份</h1>
      <p id="subtitle">正在读取备份目录...</p>
    </div>
    <button id="refresh" title="重新读取报告">刷新</button>
  </header>
  <main>
    <section id="metrics" class="metrics"></section>
    <section class="band">
      <div class="section-head"><h2>下载覆盖</h2><span id="coverage-note"></span></div>
      <div class="coverage"><div id="coverage-bar"></div></div>
      <p id="coverage-text"></p>
    </section>
    <nav class="tabs" aria-label="详情">
      <button class="tab active" data-view="assets">资产结果</button>
      <button class="tab" data-view="references">引用关系</button>
      <button class="tab" data-view="nodes">节点</button>
      <button class="tab" data-view="connections">连线</button>
      <button class="tab" data-view="audit">验收说明</button>
    </nav>
    <section id="panel"></section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
